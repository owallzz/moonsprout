name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld libvulkan-dev libx11-xcb-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxss-dev libxtst-dev libxfixes-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libdecor-0-dev libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libcurl4-openssl-dev libssl-dev
      - name: Configure
        run: cmake -S . -B build-pc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build-pc --target mppm
      # rc.3 shipped Linux builds whose lobby client had no WebSocket backend (borealis fell back to
      # src/ws/no_backend.cpp). The configure now fails on that too; this checks the binary itself.
      - name: Check the WebSocket backend
        run: tools/release/check-websocket.sh build-pc/mppm

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's arm64 macOS pool often cannot take jobs ("not acquired ... capacity"), so arm64 is
          # cross-compiled on the Intel runner; Aurora's providers follow CMAKE_OSX_ARCHITECTURES.
          - arch: arm64
            runner: macos-15-intel
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # llvm: llvm-objcopy for the game's symbol renaming (CMakeLists.txt); Xcode has no objcopy.
      - name: Install tools
        run: brew install ninja llvm
      - name: Configure
        run: cmake -S . -B build-pc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DP2_OBJCOPY="$(brew --prefix llvm)/bin/llvm-objcopy"
      - name: Build
        run: cmake --build build-pc --target mppm -- -k 0 # report every failing file

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # Visual Studio's own clang-cl: its STL needs a newer Clang than the runner's C:\Program Files\LLVM.
      - name: Configure
        shell: pwsh
        run: |
          $cl = "$env:VCINSTALLDIR\Tools\Llvm\x64\bin\clang-cl.exe"
          & $cl --version
          cmake -S . -B build-pc -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_COMPILER=$cl" "-DCMAKE_CXX_COMPILER=$cl"
      - name: Build
        run: cmake --build build-pc --target mppm -- -k 0 # report every failing file
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: moonsprout-windows-x64-ci
          path: |
            build-pc/mppm.exe
            build-pc/*.dll
            build-pc/res/
          retention-days: 7

  server:
    name: Lobby server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --locked
